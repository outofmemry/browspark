name: build
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck
      - run: bun run build
      - run: bun run --cwd frontend build
      - run: bun test --timeout 120000
      - run: bun run --cwd frontend test
      - name: docs in sync
        run: bun run docs:tools && git diff --exit-code -- docs/
