name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck
      - run: bun run build
      - run: bun run --cwd frontend build
      - run: bun test --timeout 120000
      - run: bun run --cwd frontend test
      - run: bun run package
      - id: check
        name: skip if this version already released
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then echo "released=true" >> "$GITHUB_OUTPUT"; fi
      - name: publish to npm
        if: steps.check.outputs.released != 'true'
        run: |
          npm install -g npm@latest
          npm publish --access public --provenance
          for a in aliases/*; do (cd "$a" && npm publish --access public --provenance); done
      - name: github release
        if: steps.check.outputs.released != 'true'
        run: gh release create "v$VERSION" --title "$VERSION" --generate-notes dist/browspark-chrome-extension.zip dist/browspark-firefox-extension.zip
        env:
          VERSION: ${{ steps.check.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
