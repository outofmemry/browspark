<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Browspark</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="shell">
  <aside class="sidebar" aria-label="Browser profile navigation">
    <a class="brand" href="#/overview" aria-label="Browspark overview">
      <span class="brand-mark"><img src="assets/logo.png" alt=""></span>
      <span><span class="brand-name">Browspark</span><span class="brand-sub">Browser automation</span></span>
    </a>
    <div class="workspace-card">
      <span class="workspace-avatar" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span>
      <div><div class="workspace-name">This browser profile</div><div class="workspace-meta">One shared companion</div></div>
    </div>
    <div class="nav-caption">This profile</div>
    <nav id="nav" aria-label="Main navigation"></nav>
    <div class="side-foot">
      <div class="privacy-note"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6z"/><path d="m8 12 3 3 5-6"/></svg><span>You control what’s shared</span></div>
      <div class="conn" id="conn"></div>
      <div class="appearance-label">Appearance</div>
      <div class="theme" id="theme" role="group" aria-label="Theme"></div>
      <div class="version-row"><span id="ver"></span><span>Local &amp; private</span></div>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="breadcrumb"><span>This profile</span><span aria-hidden="true">/</span><span id="crumb">Overview</span></div>
      <div class="topbar-actions"><span class="local-badge" id="session-status" role="status"></span><a href="#/settings" aria-label="Open connection settings" title="Connection settings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22v-5M9 8V2M15 8V2M18 8v5a6 6 0 0 1-12 0V8z"/></svg></a></div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<script src="dist/app.js"></script>
</body>
</html>
