<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Browspark</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="shell">
  <aside class="sidebar" aria-label="Browser profile navigation">
    <div class="side-top">
      <a class="brand" href="#/overview" aria-label="Browspark overview">
        <span class="brand-mark"><img src="assets/logo.png" alt=""></span>
        <span class="brand-name">Browspark</span>
      </a>
      <div class="theme" id="theme" role="group" aria-label="Theme"></div>
    </div>
    <section class="profile-card" aria-label="This browser profile">
      <div class="profile-head" id="profile"></div>
      <div class="conn" id="conn"></div>
    </section>
    <div id="update-slot"></div>
    <div class="nav-caption">Workspace</div>
    <nav id="nav" aria-label="Main navigation"></nav>
    <div class="side-foot">
      <div class="privacy-note"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6z"/><path d="m8 12 3 3 5-6"/></svg><span>Local &amp; private. You control what’s shared.</span></div>
      <div class="side-meta"><a class="side-link" href="https://docs.browspark.krishm.dev/" target="_blank" rel="noreferrer"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg><span>Documentation</span><svg class="i ext" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a><span class="brand-ver" id="ver"></span></div>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="breadcrumb"><span>This profile</span><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg><span id="crumb">Overview</span></div>
      <div class="topbar-actions"><span class="local-badge" id="session-status" role="status"></span><a href="#/settings" aria-label="Open connection settings" title="Connection settings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22v-5M9 8V2M15 8V2M18 8v5a6 6 0 0 1-12 0V8z"/></svg></a></div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div id="update-layer"></div>
<script src="dist/app.js"></script>
</body>
</html>
